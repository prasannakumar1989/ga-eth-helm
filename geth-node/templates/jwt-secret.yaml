# templates/jwt-secret.yaml
{{- if eq .Values.jwt.source "external-secrets" }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.jwt.secretName }}
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.jwt.externalSecret.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.jwt.secretName }}
  data:
    - secretKey: jwt.hex
      remoteRef:
        key: {{ .Values.jwt.externalSecret.remoteKey }}
{{- end }}
{{- /* source=manual: Secret is pre-created by the operator, nothing to render */}}