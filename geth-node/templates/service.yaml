apiVersion: v1
kind: Service
metadata:
  name: {{ include "geth-node.fullname" . }}-rpc
spec:
  type: ClusterIP
  ports:
    - name: http-rpc
      port: {{ .Values.service.rpcPort }}
    - name: ws
      port: {{ .Values.service.wsPort }}
    - name: engine-api
      port: 8551
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "geth-node.fullname" . }}-p2p
spec:
  type: LoadBalancer
  ports:
    - name: p2p-tcp
      port: 30303
      protocol: TCP
    - name: p2p-udp
      port: 30303
      protocol: UDP